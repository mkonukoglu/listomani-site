<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Listomani</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){body{background:#000;color:#F2F2F7}}
</style>
</head>
<body>
<p>Listomani…</p>
<script>
// Sign-in relay: the app opens listomani.com/auth/?to=<Listomani's own sign-in URL>, so the iOS sign-in prompt
// names listomani.com instead of the backend host. Only our own backends and only their /auth/v1/authorize path
// are allowed; anything else is ignored (no open redirect).
(function () {
  var ALLOWED = ['gryobmwinjjvasykytpq.supabase.co', 'dibgsxxmpgyyinundypl.supabase.co'];
  try {
    var to = new URL(new URLSearchParams(location.search).get('to'));
    if (to.protocol === 'https:' && ALLOWED.indexOf(to.hostname) !== -1 && to.pathname === '/auth/v1/authorize') {
      location.replace(to.href);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
